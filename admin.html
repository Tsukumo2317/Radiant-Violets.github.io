<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кабинет администратора — RADIANT VIOLETS</title>
    <link rel="stylesheet" href="./css/style.css">
    <link type="image/x-icon" href="./icon/Logo.png" rel="shortcut icon">
</head>
<body>
    <main class="admin-page">
        <section class="admin-head">
            <div class="admin-head-row">
                <div>
                    <h1>Кабинет администратора</h1>
                    <p>Заказы за день, отзывы к товарам и добавление в каталог.</p>
                </div>
                <div class="admin-head-actions">
                    <a href="./catalog.html" class="admin-link">Каталог</a>
                    <a href="./index.html" class="admin-link">На сайт</a>
                    <button type="button" class="admin-logout-btn" id="adminLogoutBtn">Выйти</button>
                </div>
            </div>
        </section>

        <div class="admin-tabs" role="tablist" aria-label="Разделы админ-панели">
            <button type="button" class="admin-tab is-active" role="tab" id="admin-tab-orders" data-tab="orders" aria-selected="true" aria-controls="admin-panel-orders">Заказы за день</button>
            <button type="button" class="admin-tab" role="tab" id="admin-tab-reviews" data-tab="reviews" aria-selected="false" aria-controls="admin-panel-reviews">Отзывы</button>
            <button type="button" class="admin-tab" role="tab" id="admin-tab-products" data-tab="products" aria-selected="false" aria-controls="admin-panel-products">Товары</button>
        </div>

        <div class="admin-panels">
            <section class="admin-panel is-active" role="tabpanel" id="admin-panel-orders" aria-labelledby="admin-tab-orders">
                <div class="admin-panel-toolbar">
                    <p class="admin-today-label" id="adminTodayCount">Загрузка…</p>
                    <button type="button" class="ghost" id="adminRefreshOrders">Обновить</button>
                </div>
                <div id="adminTodayOrders" class="admin-today-orders"></div>
            </section>

            <section class="admin-panel" role="tabpanel" id="admin-panel-reviews" aria-labelledby="admin-tab-reviews" hidden>
                <div class="admin-grid admin-grid-reviews">
                    <form id="adminReviewForm" class="admin-form">
                        <h2>Новый отзыв к товару</h2>
                        <label>Товар
                            <select id="adminReviewProduct" name="productId" required></select>
                        </label>
                        <label>Имя в отзыве
                            <input type="text" id="adminReviewAuthor" name="author" placeholder="RADIANT VIOLETS" value="RADIANT VIOLETS">
                        </label>
                        <label>Оценка
                            <select id="adminReviewStars" name="stars">
                                <option value="5">5 — отлично</option>
                                <option value="4">4</option>
                                <option value="3">3</option>
                                <option value="2">2</option>
                                <option value="1">1</option>
                            </select>
                        </label>
                        <label>Текст отзыва
                            <textarea id="adminReviewText" name="text" rows="4" required placeholder="Текст, который увидят на главной…"></textarea>
                        </label>
                        <button type="submit">Опубликовать на сайте</button>
                        <p id="adminReviewStatus" class="admin-status"></p>
                    </form>
                    <aside class="admin-list-wrap">
                        <h2>Опубликованные отзывы</h2>
                        <div id="adminReviewsList" class="admin-reviews-list"></div>
                    </aside>
                </div>
            </section>

            <section class="admin-panel" role="tabpanel" id="admin-panel-products" aria-labelledby="admin-tab-products" hidden>
                <div class="admin-grid">
                    <form id="adminProductForm" class="admin-form">
                        <h2>Новый товар</h2>
                        <label>Название
                            <input name="name" type="text" required>
                        </label>
                        <label>Текущая цена
                            <input name="currentPrice" type="number" min="0" required>
                        </label>
                        <label>Старая цена
                            <input name="oldPrice" type="number" min="0" value="0">
                        </label>
                        <label>Главное фото (imageUrl)
                            <input name="imageUrl" type="text" placeholder="./Товары/.../1.jpg" required>
                        </label>
                        <label>Категория
                            <select name="categoryId">
                                <option value="rings">Кольца</option>
                                <option value="earrings">Серьги</option>
                                <option value="bracelets">Браслеты</option>
                                <option value="necklaces">Ожерелья/подвески</option>
                                <option value="engagement">Помолвочные кольца</option>
                            </select>
                        </label>
                        <label>Огранка
                            <select name="cutId">
                                <option value="round">Круглая</option>
                                <option value="princess">Принцесса</option>
                                <option value="emerald">Изумруд</option>
                                <option value="oval">Овальная</option>
                                <option value="pear">Груша</option>
                                <option value="heart">Сердце</option>
                                <option value="cushion">Подушка</option>
                            </select>
                        </label>
                        <label>Размер
                            <input name="size" type="number" step="0.5" min="0">
                        </label>
                        <label>Металлы (через запятую: gold, white, silver)
                            <input name="metals" type="text" placeholder="gold, white">
                        </label>
                        <label>Остаток
                            <input name="stock" type="number" min="0" value="5">
                        </label>
                        <label>SKU
                            <input name="sku" type="text" placeholder="RV-XX-123">
                        </label>
                        <label>Описание
                            <textarea name="description" rows="4"></textarea>
                        </label>
                        <label>Фото галереи (каждое с новой строки)
                            <textarea name="mediaImages" rows="4" placeholder="./Товары/.../1.jpg"></textarea>
                        </label>
                        <label>Видео (каждое с новой строки)
                            <textarea name="mediaVideos" rows="4" placeholder="./Товары/.../1.mp4"></textarea>
                        </label>
                        <div class="admin-form-actions">
                            <button type="submit">Добавить товар</button>
                            <button type="button" id="adminResetBtn" class="ghost">Очистить форму</button>
                        </div>
                        <p id="adminStatus" class="admin-status"></p>
                    </form>
                    <aside class="admin-list-wrap">
                        <div class="admin-list-head">
                            <h2>Добавленные товары</h2>
                            <button type="button" id="adminClearAllBtn" class="ghost danger">Удалить все</button>
                        </div>
                        <div id="adminProductsList" class="admin-products-list"></div>
                    </aside>
                </div>
            </section>
        </div>
    </main>

    <script src="./Js/products-data.js"></script>
    <script src="./Js/admin-auth.js"></script>
    <script src="./Js/shop-orders.js"></script>
    <script src="./Js/site-reviews.js"></script>
    <script src="./Js/admin.js"></script>
    <script src="./Js/admin-cabinet.js"></script>
</body>
</html>
